  - id: m9-webhook-endpoints
    title: "M9: Webhook endpoint registration + BullMQ delivery with retry"
    type: manual
    category: Platform
    initiative: M9 Webhooks + API Keys
    due_date: 2026-06-08
    instructions: |
      Webhook system:
      - POST /webhooks — register endpoint URL + event filter + auto-generated
        HMAC secret. Stored in WebhookEndpoint table.
      - GET /webhooks — list org's webhook endpoints
      - DELETE /webhooks/:id — deactivate

      BullMQ job: webhook-delivery
      - POST event payload to registered URL
      - HMAC-SHA256 signature header: X-Sealio-Signature: sha256=<hex>
      - Retry: 3 retries, exponential backoff (1s, 5s, 30s)
      - Dead-letter after final failure

      GET /webhooks/:id/deliveries — delivery log (status, response code,
      attempt count, timestamps).

      Rachel gate: retry logic tested, HMAC verified.

      ## Acceptance criteria
      - [ ] POST /webhooks registers endpoint with event filter + HMAC secret
      - [ ] BullMQ job fires on document.signed, document.completed, etc.
      - [ ] HMAC-SHA256 header on every delivery
      - [ ] 3 retries, exponential backoff (1s / 5s / 30s)
      - [ ] Dead-letter on final failure
      - [ ] Delivery log with status + response code + attempt count

      ## Test
      Register a webhook pointing to a local echo server. Complete a signing →
      delivery attempt logged. Stop echo server → 3 retries logged → dead-letter.
      Verify HMAC with the registered secret. (Rachel gate)

  - id: m9-api-keys
    title: "M9: API key creation, auth middleware, and revocation"
    type: manual
    category: Platform
    initiative: M9 Webhooks + API Keys
    due_date: 2026-06-08
    instructions: |
      Programmatic API access:
      - POST /api-keys — generate sk_live_... prefixed key, store Argon2 hash
        in ApiKey table (never plaintext). Return raw key once only.
      - GET /api-keys — list (name, createdAt, lastUsedAt — no raw key)
      - DELETE /api-keys/:id — revoke

      Auth middleware: accepts Authorization: Bearer sk_live_... header as an
      alternative to the JWT cookie. Same protections apply.

      ## Acceptance criteria
      - [ ] POST /api-keys generates sk_live_... prefix key
      - [ ] Raw key returned once; only Argon2 hash stored in DB
      - [ ] Authorization: Bearer header accepted on all protected routes
      - [ ] GET /api-keys — list without raw key
      - [ ] DELETE /api-keys/:id — revokes key

      ## Test
      Create key → copy raw value → curl a protected route with Bearer header →
      200. Revoke key → same curl → 401. Raw key not stored in DB (only hash).

