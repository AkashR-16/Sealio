  - id: m5-field-submission-complete
    title: "M5: Field submission + POST /sign/:token/complete"
    type: manual
    category: Platform
    initiative: M5 Signing Experience
    due_date: 2026-06-02
    instructions: |
      Each field submission saves the signer's response:
