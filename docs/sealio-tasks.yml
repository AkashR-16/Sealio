  # ===========================================================================
  # M4 — SEND FOR SIGNING + EMAIL OTP
  # ===========================================================================

  - id: m4-send-document-api
    title: "M4: POST /documents/:id/send — create signing requests"
    type: manual
    category: Platform
    initiative: M4 Send for Signing
    due_date: 2026-05-29
    instructions: |
      POST /documents/:id/send validates the document (draft status, at least
      one field, all fields assigned) then:
      - Creates one SigningRequest record per unique assignedToEmail
      - Generates a unique signing token (cuid) per SigningRequest
      - Sets Document.status to "sent"

      Returns the list of signing requests created.

      ## Acceptance criteria
      - [ ] Validates: document must be draft; must have ≥1 field; all fields assigned
      - [ ] Creates SigningRequest per unique signer email
      - [ ] Each SigningRequest gets a unique cuid token
      - [ ] Document.status → "sent"
      - [ ] Returns signing request list in response

      ## Test
      Send a document with 2 signers → 2 SigningRequest rows in DB → document
      status = "sent". Sending again → 409 (not draft).

  - id: m4-otp-generation-email
    title: "M4: OTP generation + signing invitation email via Mailhog"
    type: manual
    category: Platform
    initiative: M4 Send for Signing
    due_date: 2026-05-29
    instructions: |
      When a SigningRequest is created:
      - Generate a 6-digit OTP, bcrypt hash it, store in SigningRequest.otpHash
      - Set otpExpiresAt = now + 10 minutes
      - Send signing invitation email via Mailhog (HTML template) with the
        signing link: $APP_URL/sign/[token]
      - Send OTP separately in a second email

      Rate limiting on OTP endpoint: max 3 attempts per token, then invalidate.

      ## Acceptance criteria
      - [ ] 6-digit OTP generated and bcrypt-hashed before storage
      - [ ] otpExpiresAt = now + 10 min
      - [ ] Invitation email sent via Mailhog with signing link
      - [ ] OTP sent in separate email
      - [ ] Rate limit: 3 failed attempts → token invalidated
      - [ ] Expired OTP → 401 with clear error message

      ## Test
      Send document → check Mailhog (localhost:8025) → 2 emails per signer.
      Try wrong OTP 3 times → token invalidated. Wait for expiry → OTP rejected.
      (Rachel gate)

  - id: m4-sign-token-routes
    title: "M4: GET + POST /sign/:token/* — token validation + OTP auth"
    type: manual
    category: Platform
    initiative: M4 Send for Signing
    due_date: 2026-05-30
    instructions: |
      Three signing routes (no session auth — public routes):
      - GET /sign/:token — validate token (not expired/used), return document
        metadata (title, signer name/email, fields count). No PDF yet.
      - POST /sign/:token/authenticate — verify OTP → issue short-lived
        signing JWT (stored in httpOnly cookie, 1hr expiry)
      - GET /sign/:token/document — stream PDF via presigned MinIO URL
        (only after OTP verified; signing JWT required)

      ## Acceptance criteria
      - [ ] GET /sign/:token — valid token returns metadata; invalid → 404
      - [ ] POST /sign/:token/authenticate — correct OTP → signing JWT cookie
      - [ ] POST /sign/:token/authenticate — wrong OTP → 401 (count attempts)
      - [ ] GET /sign/:token/document — requires signing JWT; no JWT → 401
      - [ ] Replay prevention: token single-use (marked viewed on first valid hit)

      ## Test
      Get signing link from invitation email → GET /sign/:token → metadata.
      Enter wrong OTP → 401. Enter correct OTP → signing JWT set. GET
      /sign/:token/document → PDF streams. (Rachel gate: replay attacks blocked)

