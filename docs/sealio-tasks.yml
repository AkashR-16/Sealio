  - id: m1-jwt-auth-routes
    title: "M1: JWT RS256 + auth routes (DONE)"
    type: manual
    category: Platform
    initiative: M1 Database + Auth
    due_date: 2026-05-25
    instructions: |
      RS256 key pair. Fastify JWT plugin (access 15min + refresh 7d, httpOnly
      cookies). Five auth routes: signup, login, refresh, logout, /me.
      Fastify authenticate decorator for all protected routes.

      **Status: DONE 2026-05-25.** 13 integration tests green (Rachel gate).

      ## Acceptance criteria
      - [x] POST /auth/signup — create org + user, return JWT pair
      - [x] POST /auth/login — bcrypt verify, return JWT pair
      - [x] POST /auth/refresh — rotate refresh token
      - [x] POST /auth/logout — clear cookies
      - [x] GET /auth/me — return session user from JWT
      - [x] Fastify authenticate decorator wired to all protected routes
      - [x] 13 integration tests green (real Postgres)

