        Marks SigningRequest.status = "signed", sets signedAt
        Creates AuditEvent: document.signed
        If all signers done → triggers document sealing (M6)

      ## Acceptance criteria
      - [ ] POST /sign/:token/fields/:fieldId creates Signature record
      - [ ] Field completion status returned to UI
      - [ ] POST /sign/:token/complete → SigningRequest.status = "signed"
      - [ ] AuditEvent written: document.signed
      - [ ] All signers signed → document sealing triggered
      - [ ] Cannot complete if required fields missing → 400

      ## Test
      Fill all fields for signer 1 → complete → SigningRequest = signed.
      Attempt complete with missing required field → 400 error returned.

  # ===========================================================================
  # M6 — DOCUMENT SEALING + AUDIT TRAIL
  # ===========================================================================

  - id: m6-pdf-sealing
    title: "M6: Embed signatures into PDF using pdf-lib"
    type: manual
    category: Platform
    initiative: M6 Document Sealing
    due_date: 2026-06-03
    instructions: |
      When all SigningRequests are signed:
      1. Download the original PDF from MinIO
      2. Use pdf-lib to embed each signature at its field coordinates
         (convert % coordinates back to absolute pts per page)
      3. Compute signedHashSha256 of the sealed PDF
      4. Upload sealed PDF to MinIO at signed/{documentId}.pdf
      5. Update Document.signedFilePath and Document.signedHashSha256
      6. Set Document.status = "completed"

      Signatures may be: base64 image (draw/upload) rendered as an image,
      or typed text rendered in the chosen script font.

      ## Acceptance criteria
      - [ ] pdf-lib embeds all signatures at correct positions
      - [ ] Image signatures (draw/upload) appear as images
      - [ ] Typed signatures appear as styled text
      - [ ] signedHashSha256 computed from sealed bytes
      - [ ] Sealed PDF stored at signed/{documentId}.pdf in MinIO
      - [ ] Document.status → "completed"

      ## Test
      Complete signing → download sealed PDF → open in Preview/Acrobat →
      signatures visible at field positions. Hash stored in DB matches
      SHA-256 of downloaded file. (Ryan gate)

  - id: m6-audit-trail-hash-chain
    title: "M6: Append-only audit trail with SHA-256 hash chain"
    type: manual
    category: Platform
    initiative: M6 Document Sealing
    due_date: 2026-06-03
    instructions: |
      Every state-changing event writes an AuditEvent row. The chain:
        eventHash = SHA256(prevHash + eventType + actorEmail + timestamp)

      Events: document.created | sent | viewed | signed | completed |
      declined | expired | voided

      Ryan's rule: NO UPDATE or DELETE on AuditEvent ever. Only INSERTs.
      Verify: grep codebase for AuditEvent + UPDATE/DELETE → must return zero.

      ## Acceptance criteria
      - [ ] AuditEvent written for every state transition
      - [ ] Hash chain: each event hashes prevHash + eventType + actor + ts
      - [ ] First event in chain: prevHash = null
      - [ ] No UPDATE or DELETE on AuditEvent anywhere in codebase
      - [ ] GET /documents/:id/audit returns full chain in order

      ## Test
      Send → view → sign → complete → 5 AuditEvents. Compute hash chain
