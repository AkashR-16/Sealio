# Sealio — build-tracking playbook for the LaunchForge/VeriSOP engine.
#
# PROJECT:  sealio-build
# TENANT:   Beatura Labs
#
# CONSUMPTION (non-negotiable):
#   - Engine consumed via HTTP API only. No library import, no fork, no direct
#     Postgres connection.
#   - LF_ADMIN_KEY lives only in .env.local (gitignored). Never committed.
#   - No feature flags. Gates enforced by tenant provisioning + data-driven UI.
#
# STRUCTURE:
#   Milestones map to initiatives. Each task maps 1-to-1 with a concrete
#   engineering deliverable. Done tasks (M0–M2) are included so the full
#   arc is visible; mark them complete in the UI on first load.

project: sealio-build

defaults:
  launch_date: 2026-06-09

tasks:

  # ===========================================================================
  # M0 — SCAFFOLD (DONE)
  # ===========================================================================

  - id: m0-monorepo-scaffold
    title: "M0: Turborepo monorepo scaffold (DONE)"
    type: manual
    category: Platform
    initiative: M0 Scaffold
    due_date: 2026-05-25
    instructions: |
      Initialize the Turborepo monorepo with apps/web (Next.js 16, TypeScript,
      Tailwind v4, dark theme), apps/api (Fastify, TypeScript),
      packages/db (Prisma + postgres), packages/types (shared types).

      **Status: DONE 2026-05-25.** Monorepo booting. pnpm dev → web :3000,
      api :3001.

      ## Acceptance criteria
      - [x] Turborepo initialized, pnpm workspaces wired
      - [x] apps/web — Next.js 16 + TypeScript strict + Tailwind v4 dark theme
      - [x] apps/api — Fastify + TypeScript strict
      - [x] packages/db — Prisma + postgres provider
      - [x] packages/types — shared TypeScript types
      - [x] docker-compose.yml — postgres, redis, minio, mailhog
      - [x] .env.local template with all required vars
      - [x] turbo.json — dev, build, test pipelines
      - [x] docker compose up → all 4 services healthy
      - [x] pnpm dev → web :3000, api :3001, no errors

      ## Test
      `docker compose up` → all healthy. `pnpm dev` → both apps boot.

